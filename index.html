<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AO Accounts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/ao-logo.jpg" alt="AO Logo">
      <div>
        <h1>AO Accounts</h1>
        <p>Invoices • Payments • Balances</p>
      </div>
    </div>
    <button id="newInvoiceBtn" class="primary">+ فاتورة جديدة</button>
  </header>

  <main class="container">
    <section class="stats">
      <article class="card"><span>إجمالي الفواتير</span><strong id="statInvoices">0.000 د.ب</strong></article>
      <article class="card"><span>إجمالي المسدد</span><strong id="statPaid">0.000 د.ب</strong></article>
      <article class="card"><span>إجمالي المتبقي</span><strong id="statBalance">0.000 د.ب</strong></article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>الفواتير</h2>
        <input id="search" placeholder="بحث بالعميل أو رقم الفاتورة">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>رقم الفاتورة</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th>
              <th>المسدد</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="invoiceRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="invoiceDialog">
    <form id="invoiceForm" method="dialog">
      <div class="dialog-head">
        <h3 id="invoiceDialogTitle">فاتورة جديدة</h3>
        <button type="button" class="icon" data-close="invoiceDialog">×</button>
      </div>
      <input type="hidden" id="invoiceId">
      <div class="grid">
        <label>رقم الفاتورة<input id="invoiceNo" readonly></label>
        <label>التاريخ<input id="invoiceDate" type="date" required></label>
        <label class="span2">اسم العميل<input id="customerName" required></label>
        <label class="span2">البيان / الوصف<textarea id="description" rows="3" required></textarea></label>
        <label>المبلغ (د.ب)<input id="amount" type="number" step="0.001" min="0" required></label>
        <label>الضريبة %<input id="vatRate" type="number" step="0.01" min="0" value="0"></label>
      </div>
      <div class="totals-preview">
        <span>الإجمالي</span><strong id="invoiceTotalPreview">0.000 د.ب</strong>
      </div>
      <div class="actions">
        <button type="button" class="secondary" data-close="invoiceDialog">إلغاء</button>
        <button type="submit" class="primary">حفظ الفاتورة</button>
      </div>
    </form>
  </dialog>

  <dialog id="paymentDialog">
    <form id="paymentForm" method="dialog">
      <div class="dialog-head">
        <h3>تسجيل سداد</h3>
        <button type="button" class="icon" data-close="paymentDialog">×</button>
      </div>
      <input type="hidden" id="paymentInvoiceId">
      <div class="grid">
        <label>التاريخ<input id="paymentDate" type="date" required></label>
        <label>المبلغ<input id="paymentAmount" type="number" step="0.001" min="0.001" required></label>
        <label class="span2">طريقة الدفع
          <select id="paymentMethod">
            <option>Bank Transfer</option><option>BenefitPay</option><option>Cash</option><option>Cheque</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button type="button" class="secondary" data-close="paymentDialog">إلغاء</button>
        <button type="submit" class="primary">تسجيل السداد</button>
      </div>
    </form>
  </dialog>

  <section id="printArea" class="invoice-print"></section>

  <script src="app.js"></script>
</body>
</html>
